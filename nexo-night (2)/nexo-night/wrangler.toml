# Cloudflare config for deploying the built static site via `wrangler deploy`
# (Workers Static Assets). Requires the build step to run first so that ./dist
# exists — set the project's Build command to:  npm run build
name = "nexo-night"
compatibility_date = "2025-06-01"

[assets]
directory = "./dist"
# Serve index.html for unknown routes so /play, /admin, … survive a refresh.
not_found_handling = "single-page-application"
