# Netlify build + SPA routing config.
# Works for both "Import from Git" and manual dist drops.
[build]
  command = "npm run build"
  publish = "dist"

# Send every unknown path to the SPA so client-side routes (/play, /admin, …)
# survive a page refresh instead of 404-ing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
